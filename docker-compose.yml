services:
  nginx:
    image: nginx:1.27-alpine
    container_name: huigui-nginx
    restart: unless-stopped
    depends_on:
      - app
      - api
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/creative-factory/deploy/creative-hui-health.nginx.conf:/etc/nginx/conf.d/creative-hui-health.conf:ro
      - ./apps/web/public:/var/www/public:ro
      - ${UPLOADS_DIR:-./storage/uploads}:/var/www/uploads
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      TZ: ${TZ:-Asia/Shanghai}

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-洄归生态客户管理与报价协同系统}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
    container_name: huigui-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-洄归生态客户管理与报价协同系统}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: huigui-api
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NODE_ENV: production
      PORT: 3001
      API_PORT: 3001
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DATABASE_URL: ${DATABASE_URL:-mysql://huigui:HuiguiDB2026@mysql:3306/huigui_crm}
      DB_WAIT_TIMEOUT: ${DB_WAIT_TIMEOUT:-180}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-huigui_crm}
      MYSQL_USER: ${MYSQL_USER:-huigui}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-HuiguiDB2026}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-Huigui@123}
      PDF_FONT_PATH: ${PDF_FONT_PATH:-/usr/share/fonts/truetype/arphic-gbsn00lp/gbsn00lp.ttf}
      LOCAL_UPLOAD_DIR: ${LOCAL_UPLOAD_DIR:-/app/storage/uploads}
      CONTRACT_REMINDER_DAYS: ${CONTRACT_REMINDER_DAYS:-7}
      COS_REGION: ${COS_REGION:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_UPLOAD_PREFIX: ${COS_UPLOAD_PREFIX:-uploads}
      COS_UPLOAD_DURATION_SECONDS: ${COS_UPLOAD_DURATION_SECONDS:-1800}
      WECOM_CORP_ID: ${WECOM_CORP_ID:-}
      WECOM_AGENT_ID: ${WECOM_AGENT_ID:-}
      WECOM_SECRET: ${WECOM_SECRET:-}
      WECOM_CRM_DOMAIN: ${WECOM_CRM_DOMAIN:-crm.hui-health.com}
      WECOM_CRM_AGENT_ID: ${WECOM_CRM_AGENT_ID:-}
      WECOM_CRM_SECRET: ${WECOM_CRM_SECRET:-}
      WECOM_MANAGEMENT_DOMAIN: ${WECOM_MANAGEMENT_DOMAIN:-management.hui-health.com}
      WECOM_MANAGEMENT_AGENT_ID: ${WECOM_MANAGEMENT_AGENT_ID:-}
      WECOM_MANAGEMENT_SECRET: ${WECOM_MANAGEMENT_SECRET:-}
      WECOM_TOKEN: ${WECOM_TOKEN:-}
      WECOM_AES_KEY: ${WECOM_AES_KEY:-}
      WECOM_BASE_URL: ${WECOM_BASE_URL:-https://qyapi.weixin.qq.com}
      WECOM_CALENDAR_ID: ${WECOM_CALENDAR_ID:-}
      WECOM_REIMBURSEMENT_TEMPLATE_ID: ${WECOM_REIMBURSEMENT_TEMPLATE_ID:-}
      WECOM_PAYMENT_TEMPLATE_ID: ${WECOM_PAYMENT_TEMPLATE_ID:-}
      WECOM_LOAN_TEMPLATE_ID: ${WECOM_LOAN_TEMPLATE_ID:-}
      WECOM_DRY_RUN: ${WECOM_DRY_RUN:-}
      WECOM_EMPLOYEE_IDENTITY_MAP: ${WECOM_EMPLOYEE_IDENTITY_MAP:-}
      WEEKLY_REPORT_URL: ${WEEKLY_REPORT_URL:-}
      WEEKLY_REPORT_WECOM_USERID_MAP: ${WEEKLY_REPORT_WECOM_USERID_MAP:-}
      WEEKLY_REMINDER_TOKEN: ${WEEKLY_REMINDER_TOKEN:-}
      WEEKLY_SUMMARY_TOKEN: ${WEEKLY_SUMMARY_TOKEN:-}
      WEEKLY_SUMMARY_URL: ${WEEKLY_SUMMARY_URL:-}
      WEEKLY_SUMMARY_GROUP_IDS: ${WEEKLY_SUMMARY_GROUP_IDS:-core,light_home,all_leaders}
      WEEKLY_SUMMARY_NOTIFICATION_DRY_RUN: ${WEEKLY_SUMMARY_NOTIFICATION_DRY_RUN:-}
      WEEKLY_PERSONAL_SUMMARY_PERIOD_ID: ${WEEKLY_PERSONAL_SUMMARY_PERIOD_ID:-}
      WEEKLY_PERSONAL_SUMMARY_PERIOD_LABEL: ${WEEKLY_PERSONAL_SUMMARY_PERIOD_LABEL:-}
      WEEKLY_PERSONAL_SUMMARY_MEMBERS: ${WEEKLY_PERSONAL_SUMMARY_MEMBERS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_WEEKLY_SUMMARY_BASE_URL: ${OPENAI_WEEKLY_SUMMARY_BASE_URL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-}
      OPENAI_WEEKLY_SUMMARY_MODEL: ${OPENAI_WEEKLY_SUMMARY_MODEL:-}
      OPENAI_WEEKLY_SUMMARY_DRY_RUN: ${OPENAI_WEEKLY_SUMMARY_DRY_RUN:-}
      OPENAI_WEEKLY_SUMMARY_STRICT: ${OPENAI_WEEKLY_SUMMARY_STRICT:-}
      OPENAI_WEEKLY_PERSONAL_SUMMARY_MODEL: ${OPENAI_WEEKLY_PERSONAL_SUMMARY_MODEL:-}
      OPENAI_WEEKLY_PERSONAL_SUMMARY_DRY_RUN: ${OPENAI_WEEKLY_PERSONAL_SUMMARY_DRY_RUN:-}
      OPENAI_WEEKLY_PERSONAL_SUMMARY_STRICT: ${OPENAI_WEEKLY_PERSONAL_SUMMARY_STRICT:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,huigui-api,huigui-nginx,huigui-mysql,openai-egress-mihomo}
    volumes:
      - ${UPLOADS_DIR:-./storage/uploads}:${LOCAL_UPLOAD_DIR:-/app/storage/uploads}

  mysql:
    image: mysql:8.0
    container_name: huigui-mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-huigui_crm}
      MYSQL_USER: ${MYSQL_USER:-huigui}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-HuiguiDB2026}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ${MYSQL_DATA_DIR:-./storage/mysql}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
