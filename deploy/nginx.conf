server {
    listen 443 ssl;
    http2 on;
    server_name management.hui-health.com;

    ssl_certificate /etc/letsencrypt/live/crm.hui-health.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.hui-health.com/privkey.pem;

    client_max_body_size 100m;
    root /var/www/public/employee-frontend/current;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /WW_verify_c3gCJkz4TJsbTeiJ.txt {
        root /var/www/public;
        access_log off;
        add_header Cache-Control "no-store";
        default_type text/plain;
        try_files /WW_verify_c3gCJkz4TJsbTeiJ.txt =404;
    }

    location /api/ {
        proxy_pass http://huigui_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 90s;
    }

    location /uploads/ {
        alias /var/www/uploads/;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /favicon.svg {
        try_files /favicon.svg =404;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
